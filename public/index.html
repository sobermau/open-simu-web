<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenSimu - Editor Electroneumático</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://unpkg.com/konva@9/konva.min.js"></script>
</head>
<body>
  <header>
    <h2>⚡ OpenSimu Web</h2>
    <div style="display: flex; gap: 10px; align-items: center;">
      <button class="symbol-btn" style="padding: 5px 12px; background: #2e7d32;" id="btn-play">▶ Simular</button>
      <button class="symbol-btn" style="padding: 5px 12px; background: #c62828; display: none;" id="btn-stop">⏹ Detener</button>
      <button class="symbol-btn" style="padding: 5px 10px;" id="btn-clear">Limpiar Lienzo</button>
    </div>
  </header>

  <div class="main-container">
    <aside id="sidebar">
      <h3>Eléctrica (IEC)</h3>
      <button id="add-power" class="btn-component">⚡ Alimentación 24V/0V</button>
      <button id="add-pushbutton-nc" class="btn-component">🔴 Pulsador NC (S0)</button>
      <button id="add-pushbutton" class="btn-component">🟢 Pulsador NA (S1)</button>
      <button id="add-relay" class="btn-component">🔲 Bobina Relé (K1)</button>
      <button id="add-contact-no" class="btn-component">🪜 Contacto Relé NA</button>
      <button id="add-contact-nc" class="btn-component">🪜 Contacto Relé NC</button>

      <!-- Temporizador TON -->
      <button id="add-timer-ton" class="btn-component">⏱️ Bobina TON (KT1)</button>
      <button id="add-timer-contact-no" class="btn-component">⏱️ Contacto TON NA</button>

      <h3 style="margin-top: 15px;">Neumática (ISO)</h3>
      <button class="symbol-btn" id="add-valve32">🔀 Válvula 3/2 NC</button>
      <button class="symbol-btn" id="add-cylinder">󰄌 Cilindro Neumático</button>
    </aside>

    <main id="canvas-container"></main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
