<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenSimu - Editor Electroneumático</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://unpkg.com/konva@9/konva.min.js"></script>
</head>
<body>
  <header>
    <h2>⚡ OpenSimu Web</h2>
    <div>
      <button class="symbol-btn" style="padding: 5px 10px;" id="btn-clear">Limpiar Lienzo</button>
    </div>
  </header>

  <div class="main-container">
    <aside id="sidebar">
      <h3>Eléctrica (IEC)</h3>
      <button class="symbol-btn" id="add-power">⚡ Alimentación (24V / 0V)</button>
      <button class="symbol-btn" id="add-pushbutton">🔘 Pulsador NA</button>
      <button class="symbol-btn" id="add-relay">󰝤 Relé / Bobina</button>

      <h3 style="margin-top: 15px;">Neumática (ISO)</h3>
      <button class="symbol-btn" id="add-valve32">🔀 Válvula 3/2 NC</button>
      <button class="symbol-btn" id="add-cylinder">󰄌 Cilindro Neumático</button>
    </aside>

    <main id="canvas-container"></main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
